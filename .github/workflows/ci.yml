# CI: chạy trên mọi Pull Request và mọi lần push lên develop/main.
# Job 1 Lint -> Job 2 Architecture Guard -> Job 3 Test (backend + frontend). PR chỉ được merge khi tất cả xanh.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "1. Lint & Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install flake8==7.5.0 black==26.10.1 isort==9.0.2
      - name: Backend (flake8, black, isort)
        working-directory: backend
        run: |
          flake8
          black --check .
          isort --check-only .
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Frontend (ESLint, Prettier)
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run format:check

  architecture:
    name: "2. Architecture Guard (import-linter)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r backend/requirements-dev.txt
      - name: Cấm import chéo models giữa các phân hệ
        working-directory: backend
        run: lint-imports

  test-backend:
    name: "3a. Test backend (pytest + MySQL)"
    needs: [lint, architecture]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: social_db
          MYSQL_USER: social_user
          MYSQL_PASSWORD: social_pass
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_ENGINE: mysql
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: social_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r backend/requirements-dev.txt
      - name: Kiểm tra migration đã đầy đủ
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: pytest (coverage >= 80%)
        working-directory: backend
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80

  test-frontend:
    name: "3b. Test & build frontend"
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - working-directory: frontend
        run: |
          npm ci
          npm run test
          npm run build
